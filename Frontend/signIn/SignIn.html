<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobBoard - Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="SignIn.css">
</head>
<body>
  <div class="logo">JobBoard</div>

  <main class="Sign">
    <p class="subtitle">Enter your email to creat your account for this app</p>
    <br>
    <form id="register_form">
      <input type="email" name="email" placeholder="email@domain.com" aria-label="Email" autocomplete="email" required>
      <input type="password" name="password" placeholder="password (min. 8 characters)" aria-label="Password" autocomplete="new-password" minlength="8" required>
      <p id="form_message" class="form_message" role="alert"></p>
      <button type="submit" class="btn btn-primary">Create account</button>
    </form>
    <p class="terms">Already have an account? <a href="../login/login.html">Login</a></p>
  </main>
  <script src="SignIn.js"></script>
</body>
</html>
