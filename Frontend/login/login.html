<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobBoard - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="logo">JobBoard</div>

  <main class="login">
    <h1>Enter with your account</h1>
    <p class="subtitle">Enter your email and password to login for this app</p>

    <form id="login_form">
      <input type="email" name="email" placeholder="email@domain.com" aria-label="Email" autocomplete="email" required>
      <input type="password" name="password" placeholder="password" aria-label="Password" autocomplete="current-password" required>
      <p id="form_message" class="form_message" role="alert"></p>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="terms">Don't have an account? <a href="../signIn/SignIn.html">Register</a></p>
  </main>
  <script src="login.js"></script>
</body>
</html>
